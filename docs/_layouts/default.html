<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="site-brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">SnapShop</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="https://github.com/alertcat/SnapShop" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      <article class="content">
        {{ content }}
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 AlertCat · <a href="https://github.com/alertcat/SnapShop">github.com/alertcat/SnapShop</a> · MIT License</p>
    </div>
  </footer>

</body>
</html>
